proficiency = "swords"
damage = 3
injury = 16
load = 1

[bases.Sword]
type = "weapon"
proficiency = "swords"
damage = 4
injury = 16
load = 2

[bases."Long sword"]
type = "weapon"
proficiency = "swords"
damage = 5
injury = 16
injury_two_handed = 18
load = 3
note = "Can be used 1 or 2-handed"

[bases."Short spear"]
type = "weapon"
proficiency = "spears"
damage = 3
injury = 14
load = 2
note = "Can be thrown"

[bases.Spear]
type = "weapon"
proficiency = "spears"
damage = 4
injury = 14
injury_two_handed = 16
load = 3
note = "Can be used 1 or 2-handed. Can be thrown"

[bases."Great spear"]
type = "weapon"
proficiency = "spears"
damage = 5
injury = 16
load = 4
note = "2-handed"

[bases.Axe]
type = "weapon"
