# Vocabulary and rules for the item database. tools/check.py checks src/cards.toml against this
# file; tools/build.py takes the labels and the quality texts for the cards from it.
#
# PROVISIONAL: the types and qualities below only cover what the first items need. The rules for
# extra effects (which, how many, in which combination) are still to be filled in.

# Craftsmanships an item can have (item field `craftsmanship`): the three the rule book knows. The
# superior and ancient qualities below depend on it. An item of any other make has none.
craftsmanships = ["Dwarven", "Elven", "Númenórean"]

# The skills an item can bless (item field `blessings`): Strength, Heart and Wits skills.
skills = [
  "Awe", "Athletics", "Awareness", "Hunting", "Song", "Craft",
  "Enhearten", "Travel", "Insight", "Healing", "Courtesy", "Battle",
  "Persuade", "Stealth", "Scan", "Explore", "Riddle", "Lore",
]

# What the card says for each craftsmanship, in its kind line ("Famous Weapon · Sword · elbische Arbeit").
[craft_labels]
Dwarven = "Zwergenarbeit"
Elven = "elbische Arbeit"
"Númenórean" = "númenórische Arbeit"

# Groups of weapons by Combat Proficiency, for the qualities that name one (`weapon_group`).
[weapon_groups]
close_combat = ["brawling", "swords", "axes", "spears"]
ranged = ["bows"]

# ---------------------------------------------------------------- item types
# label  first part of the kind line on the card
# stats  the base stats an item of this type must have (and may not have others):
#        damage, injury, load, protection, parry
#        An item with none of them is allowed: a card with only a name and a story
# banes  the Banes an item of this type may have, per craftsmanship, as [types.<type>.banes.<craftsmanship>]
#        tables: `choose` is how many kinds of creature the item has a Bane for (exactly), `from` the
#        kinds to choose from. A type without it, or a craftsmanship not listed, has no Bane. The kinds are
#        written like on the cards. A Bane comes with the craftsmanship: it needs no particular quality
# blessings  how many skills an item of this type blesses (exactly); a type without it has no
#        such rule. A useful item and a marvellous artefact have one skill, a wondrous item two
# plain_label  kind-line start for an item with nothing but basic rewards (and without blessings
#        or free effects): such an item is not famous, so it gets this instead of `label`. Every
#        quality that is not a basic reward makes an item famous. May be empty. Without it the
#        item always gets `label`                                              (optional)

[types.weapon]
label = "Famous Weapon"
plain_label = ""
stats = ["damage", "injury", "load"]

# Elven: one of Orcs, Wolves or Spiders. Númenórean: two of Orcs, Trolls, Wolves, Evil Men and Undead.
[types.weapon.banes.Elven]
choose = 1
from = ["Orks", "Wölfe", "Spinnen"]

[types.weapon.banes."Númenórean"]
choose = 2
from = ["Orks", "Trolle", "Wölfe", "Böse Menschen", "Untote"]

[types.armour]
label = "Famous Armour"
plain_label = ""
stats = ["protection", "load"]

[types.helm]
label = "Famous Armour"
plain_label = ""
stats = ["protection", "load"]

[types.shield]
label = "Famous Armour"
plain_label = ""
stats = ["parry", "load"]

# A shield has the same Banes as a weapon
[types.shield.banes.Elven]
choose = 1
from = ["Orks", "Wölfe", "Spinnen"]

[types.shield.banes."Númenórean"]
choose = 2
from = ["Orks", "Trolle", "Wölfe", "Böse Menschen", "Untote"]

# Items that are not weapons or armour help with skills (item field `blessings`), in three steps:
#   useful    a simple useful item: 1 extra Success die on rolls of one skill
#   artefact  a marvellous artefact: 2 extra Success dice on one skill, and a Magical success
#   wonder    a wondrous item, so powerful that it seems like magic to people: the same for two skills
# blessing_dice   the Success dice the item adds to rolls of its skills; printed as "(2d)"
# blessing_note   printed after the dice: what else the item does for its skills (optional)
# blessing_label  the word in front of the skills on the card, instead of Blessing(s) (optional)
[types.useful]
label = "Useful Item"
stats = []
blessings = 1
blessing_dice = 1
blessing_label = "Skill"

[types.artefact]
label = "Marvellous Artefact"
stats = []
blessings = 1
blessing_dice = 2
blessing_note = "für 1 Hope ein Magical success"

[types.wonder]
label = "Wondrous Item"
stats = []
blessings = 2
blessing_dice = 2
blessing_note = "für 1 Hope ein Magical success"

# ---------------------------------------------------------------- bases
