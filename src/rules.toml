# checks it, and the item wizard of the website offers them.
# type          the item type
# proficiency   weapons only: the Combat Proficiency
# damage, injury, injury_two_handed, protection, parry, load   the stats ("d" dice for protection)
# note          what the rule book says besides the stats; only shown, not checked (optional)
# The weapons are the Core Rules table; its Unarmed entry has no Injury, so it is not here.

[bases.Dagger]
type = "weapon"
proficiency = "brawling"
damage = 2
injury = 14
load = 0
note = "Can trigger Pierce as if it was a Sword"

[bases.Cudgel]
type = "weapon"
proficiency = "brawling"
damage = 3
injury = 12
load = 0

[bases.Club]
type = "weapon"
proficiency = "brawling"
damage = 4
injury = 14
load = 1

[bases."Short sword"]
