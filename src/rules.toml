[bases."Long-hafted axe"]
type = "weapon"
proficiency = "axes"
damage = 6
injury = 18
injury_two_handed = 20
load = 3
note = "Can be used 1 or 2-handed"

[bases."Great axe"]
type = "weapon"
proficiency = "axes"
damage = 7
injury = 20
load = 4
note = "2-handed"

[bases.Mattock]
type = "weapon"
proficiency = "axes"
damage = 7
injury = 18
load = 3
note = "2-handed"

[bases.Bow]
type = "weapon"
proficiency = "bows"
damage = 3
injury = 14
load = 2
note = "Ranged weapon. 2-handed"

[bases."Great bow"]
type = "weapon"
proficiency = "bows"
damage = 4
injury = 16
load = 4
note = "Ranged weapon. 2-handed"

[bases."Leather shirt"]
type = "armour"
protection = 1
load = 3

[bases."Leather corslet"]
