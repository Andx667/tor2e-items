# The item database. One table per item ([items.<id>]) and per treasure hoard ([hoards.<id>]).
# Further files in src/cards/*.toml are merged in, so the database can be split when it grows.
# An id may exist only once, across items and hoards. `python3 tools/check.py` checks everything.
#
# Item fields:
#   name        required
#   type        required: a type from src/rules.toml (weapon, armour, helm, shield, artefact, wonder)
#   proficiency weapons only: the Combat Proficiency, which is also the category in the PDF
#               (brawling, swords, axes, spears, bows - see [categories] in src/rules.toml)
#   base        the Core Rules item it is based on ("Long sword"); required for weapons, armour,
#               helms and shields, it is the type shown on the card
#   craft       who made it ("elbische Arbeit")
#   craftsmanship  Dwarven, Elven or Númenórean (src/rules.toml); required by the qualities whose
#               effect depends on it (Superior Fell, Ancient Close-fitting, ...)
#   damage, injury, injury_two_handed, load, protection, parry
#               base stats as whole numbers, before the qualities are applied; the card shows
#               them with the `modifies` of the qualities (src/rules.toml) applied. Leave them
#               all out for a card with only a name and a story (no stats box is printed)
#   stats_note  small note behind the stats
#   text        description
#   qualities   extra effects from src/rules.toml; their rules text is added on the card
#   banes       creatures the item is a Bane for
#   blessings   skills the item blesses
#   effects     free lines: [["Label", "Text"], ...]
#   tags        free keywords, not printed
#
# Hoard fields:
#   name        required
#   text        description
#   items       what it holds: { <item id> = <count>, ... }
#   wealth      generic wealth in Treasure points
#   wealth_note what the wealth looks like ("Silbermünzen aus Arnor")
#   tags        free keywords, not printed

hint = "Zum Ausschneiden, im Pokerkartenformat (63,5 × 88,9 mm)"
footer = ""

# Rules terms that are set in italics on the cards. Type labels and quality names from
# src/rules.toml are added automatically.
terms = [
  "Shadow weakness", "Eye Awareness", "Peril rating", "Success die", "Feat die", "Piercing Blow",
  "Core Rules", "Long-hafted axe", "Long sword", "Short sword", "Coat of mail", "Undertaking",
  "Blessings", "Blessing", "Banes", "Bane", "Damage", "Injury", "Load", "Protection", "Parry",
  "Treasure", "Hope", "Hate", "Shadow", "Awe", "Battle", "Sword", "Bow", "Shield",
]

