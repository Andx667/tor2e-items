# Famous weapons and armour from the "Circleofnoms TOR 2e Homebrew Collection" (pages 32-34, by several
# authors). Andúril, Glamdring and the Bow of the Galadhrim are left out: the database has them.
# The collection does not keep to the rule book everywhere, so some items are changed to pass the checker:
#   - a Bane against "The Enemy" is a Bane against Orcs
#   - Superior Grievous on Elven and Superior Fell on Dwarven items are the basic Grievous and Fell
#   - Gurthang's Bane against "all living things" is a free line, not a Bane of the rules
# Merged into src/cards.toml; the fields are listed at the top of that file.

[items.kriegshelm-des-azaghal]
name = "Kriegshelm des Azaghâl"
source = "homebrew"
type = "helm"
base = "Helm"
craftsmanship = "Dwarven"
protection = 1
load = 4
text = "Von Telchar von Nogrod geschmiedet. Der Helm mit Visier zeigt ein scheußliches Antlitz; König Azaghâl trug ihn gegen den Drachen Glaurung."
qualities = ["Ancient Close-fitting", "Ancient Cunning Make"]
effects = [
  ["Spezial", "Bei Intimidate Foe: Zeigt der Feat die die Gandalf-Rune, verliert der Gegner zusätzlich Hate in Höhe deiner halben Valour."],
]

