# The useful items of the pre-generated Player-heroes of the two starter sets (their travelling
# gear), and Bilbo's ring from the same sheets. The sheets only give names and skills; the texts
# are made up.
# Merged into src/cards.toml; the fields are listed at the top of that file.

# ================================================================ The One Ring Starter Set

[items.feiner-umhang-und-hut]
name = "Feiner Umhang und Hut"
source = "starter-set"
type = "useful"
text = "Guter Stoff aus dem Auenland, sauber gebürstet. Wer so gekleidet ist, wird ernst genommen."
blessings = ["Awe"]

[items.tukscher-wanderstab]
name = "Tukscher Wanderstab"
source = "starter-set"
type = "useful"
text = "Ein leichter, zäher Stab, wie ihn die wanderlustigen Tuks seit jeher schneiden."
blessings = ["Travel"]

[items.erlesener-regenschirm]
name = "Erlesener Regenschirm"
source = "starter-set"
type = "useful"
text = "Ein Schirm mit Rüschen und gedrechseltem Griff, der jedem Argument Nachdruck verleiht."
blessings = ["Persuade"]

[items.tuksches-wanderbuendel]
name = "Tuksches Wanderbündel"
source = "starter-set"
type = "useful"
text = "Ein Bündel am Stock mit allem, was man abseits der Wege braucht."
blessings = ["Explore"]

[items.feine-kleider]
name = "Feine Kleider"
source = "starter-set"
type = "useful"
text = "Sonntagsstaat mit Spitze und Bändern, für Besuche bei besseren Leuten."
blessings = ["Courtesy"]

[items.kaninchenmesser]
name = "Kaninchenmesser"
source = "starter-set"
type = "useful"
text = "Ein kurzes, scharfes Messer zum Abziehen von Kaninchen."
blessings = ["Hunting"]

[items.zwergenfiedel]
name = "Zwergenfiedel"
source = "starter-set"
type = "useful"
craftsmanship = "Dwarven"
text = "Eine Fiedel von Zwergenhand, mit tiefem, warmem Klang."
blessings = ["Song"]

[items.fein-gearbeitete-pfeife]
name = "Fein gearbeitete Pfeife"
source = "starter-set"
type = "useful"
text = "Eine langstielige Pfeife mit verziertem Kopf. Bei einer Pfeife lässt sich gut zuhören und nachdenken."
blessings = ["Insight"]

[items.bilbos-zauberring]
name = "Bilbos Zauberring"
source = "starter-set"
type = "wonder"
text = "Ein schlichter goldener Ring, gefunden in den Tiefen des Nebelgebirges."
blessings = ["Stealth", "Riddle"]
effects = [
  ["Spezial", "Für 1 Hope wird der Träger unsichtbar."],
]

