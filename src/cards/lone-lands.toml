# The publisher's sample Magical Treasure Index "Tales from the Lone-lands": six marvellous
# artefacts, six wondrous items and one famous weapon or piece of armour per Player-hero.
# Merged into src/cards.toml; the fields are listed at the top of that file.

# ================================================================ marvellous artefacts

[items.kriegshorn-von-arveleg]
name = "Kriegshorn von Arveleg"
source = "lone-lands"
type = "artefact"
craftsmanship = "Númenórean"
text = "Ein Horn aus Elfenbein, gefertigt aus dem Stoßzahn eines mächtigen Tieres des Nordens, das der König von Arnor im Kampf gegen Angmar erschlug."
blessings = ["Enhearten"]

[items.unausloeschliche-laterne]
name = "Die unauslöschliche Laterne"
source = "lone-lands"
type = "artefact"
craftsmanship = "Elven"
text = "In einem schlichten Gehäuse aus Glas und Bronze leuchtet ein Kristallsplitter, das letzte Überbleibsel einer Elbenlampe."
blessings = ["Scan"]

[items.stiefel-der-tausend-meilen]
name = "Stiefel der tausend Meilen"
source = "lone-lands"
type = "artefact"
craftsmanship = "Elven"
text = "Der alte Elbenzauber im Leder dieser Stiefel nimmt ihrem Träger die Müdigkeit."
blessings = ["Travel"]

[items.koecher-des-araw]
name = "Köcher des Araw"
source = "lone-lands"
type = "artefact"
craftsmanship = "Elven"
text = "Ein Köcher der Sindar, verziert mit Bildern von den Taten Oromës. Wer ihn trägt, dem entgeht keine Beute."
blessings = ["Hunting"]

[items.durins-wetzstein]
name = "Durins Wetzstein"
source = "lone-lands"
type = "artefact"
craftsmanship = "Dwarven"
text = "Mit diesem wunderbaren Stein hielten die Könige von Durins Volk ihre Werkzeuge scharf wie frisch geschmiedet."
blessings = ["Craft"]

[items.mantel-der-feinheit]
name = "Mantel der Feinheit"
source = "lone-lands"
type = "artefact"
text = "In seinen Stoff ist mit der Wolle das Wesen der Höflichkeit gewoben; er macht seinen Träger anmutig und redegewandt."
blessings = ["Courtesy"]

# ================================================================ wondrous items

[items.ring-vom-sirannon]
name = "Ring vom Sirannon"
source = "lone-lands"
type = "wonder"
craftsmanship = "Elven"
text = "Ein silberner geringerer Ring, geschmiedet von einem vergessenen Lehrling Celebrimbors."
blessings = ["Insight", "Riddle"]

[items.weisser-samen-des-westens]
name = "Weißer Samen des Westens"
source = "lone-lands"
type = "wonder"
text = "An einer goldenen Halskette hängt, in Bernstein eingeschlossen, ein Samen des Weißen Baumes."
blessings = ["Healing", "Lore"]

[items.nimrodels-traene]
name = "Nimrodels Träne"
source = "lone-lands"
type = "wonder"
text = "Ein kleiner Ohrring, ein blauer Saphir in der Form eines Wassertropfens."
blessings = ["Awareness", "Song"]

[items.armreife-von-tag-und-nacht]
name = "Zwillingsarmreife von Tag und Nacht"
source = "lone-lands"
type = "wonder"
craftsmanship = "Dwarven"
text = "In Nogrod geschmiedet: Der rechte Reif zeigt die Sonne, der linke den Mond."
blessings = ["Athletics", "Stealth"]

[items.krone-von-fornost]
name = "Krone von Fornost"
source = "lone-lands"
type = "wonder"
craftsmanship = "Númenórean"
text = "Ein goldener Stirnreif, einst getragen von den númenórischen Herrschern von Fornost Erain."
blessings = ["Awe", "Persuade"]

[items.adlerkopf]
name = "Adlerkopf"
source = "lone-lands"
type = "wonder"
craftsmanship = "Elven"
text = "Eine Brosche der Noldor, gefertigt zur Feier des Bundes zwischen ihrem Volk und dem Herrn der Adler."
blessings = ["Battle", "Explore"]

# ================================================================ famous weapons and armour

[items.schwert-der-stuerme]
name = "Schwert der Stürme"
source = "lone-lands"
type = "weapon"
proficiency = "swords"
base = "Long sword"
craftsmanship = "Númenórean"
damage = 5
injury = 16
injury_two_handed = 18
load = 3
text = "Im Zweiten Zeitalter in Lond Daer geschmiedet, das lange Heft mit Seestürmen verziert."
qualities = ["Fell", "Hammering", "Superior Grievous"]
banes = ["Böse Menschen", "Trolle"]

[items.helm-der-hadda]
name = "Helm der Hadda"
source = "lone-lands"
type = "helm"
base = "Helm"
craftsmanship = "Dwarven"
protection = 1
load = 4
text = "Dieser offene Helm wurde in Nogrod für die Rüstung einer Kriegerprinzessin gefertigt. Er ist nicht nur von außerordentlicher Machart, sondern auch mit Runen graviert, die ihn noch wirksamer machen."
qualities = ["Ancient Close-fitting", "Rune-scored Helm"]

[items.gnadenlos]
name = "Gnadenlos"
source = "lone-lands"
type = "weapon"
proficiency = "swords"
base = "Short sword"
craftsmanship = "Elven"
damage = 3
injury = 16
load = 1
text = "Einst eine Speerspitze, schwarz von Wolfsblut."
qualities = ["Luminescence", "Cleaving", "Foe-slaying"]
banes = ["Wölfe"]

[items.koller-des-seefreunds]
name = "Koller des Seefreunds"
source = "lone-lands"
type = "armour"
base = "Leather corslet"
craftsmanship = "Elven"
protection = 2
load = 6
text = "Weiß wie Meeresschaum und mit Silberdraht vernäht, ist dieses Koller vom Zauber der seefahrenden Elben von Lindon durchdrungen: zäh wie der stählerne Rammsporn eines Kriegsschiffs, doch leicht wie dessen seidene Segel."
qualities = ["Ancient Cunning Make", "Close-fitting"]

[items.schutz-des-schoepfers]
name = "Schutz des Schöpfers"
source = "lone-lands"
type = "shield"
base = "Shield"
craftsmanship = "Dwarven"
parry = 2
load = 4
text = "Ein Rundschild aus Buchenholz, am Rand mit dunklem Stahl verstärkt. Sein Griff ist aus einem Schmiedehammer gemacht, und neun flammenförmige Streben verbinden ihn mit dem Rand."
qualities = ["Superior Reinforced", "Cunning Make"]

[items.grosser-bogen-des-angnir]
name = "Großer Bogen des Angnir"
source = "lone-lands"
type = "weapon"
proficiency = "bows"
base = "Great bow"
craftsmanship = "Númenórean"
damage = 4
injury = 16
load = 4
text = "Mit ihm erlöste Angnir seinen Herrn."
qualities = ["Keen", "Straight Flight", "Hollow Steel"]
banes = ["Orks", "Untote"]
curse = "Shadow Taint"

