# Sample useful items from the "Circleofnoms TOR 2e Homebrew Collection" (pages 20-23, by several
# contributors). The lists there repeat each other and name some things under several skills: every
# thing is here once, with the skill it is first listed under. Left out is what the database already
# has in a similar form (fine clothes, cloak, umbrella, walking stick, wayfarer bundle, rabbit knife,
# fiddle, harp, pipe, rope, boots, war horn, quiver, whetstone), and what is not a thing to find
# (tattoo, scar, piercing).
# Merged into src/cards.toml; the fields are listed at the top of that file.

